name: Generate GitHub stats SVGs

# Why this exists: github-readme-stats.vercel.app (shared service) has
# frequent 503 rate-limit outages. This workflow runs jstrieb/github-stats
# inside this repo on a schedule, commits the generated SVGs to the
# `stats` branch, and they're served from raw.githubusercontent.com —
# no third-party rate limit, ever.
#
# Outputs (on `stats` branch):
#   generated/overview.svg   - main stats card (stars/commits/issues/PRs/contribs)
#   generated/languages.svg  - top languages by usage

on:
  # Run twice a day so the cards reflect fresh activity
  schedule:
    - cron: "0 */12 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Re-run when the workflow file itself changes
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout jstrieb/github-stats source
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          ref: master
          path: github-stats-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: github-stats-src
        run: pip install -r requirements.txt

      - name: Generate stats images
        working-directory: github-stats-src
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: matx104
          EXCLUDED: ""
          EXCLUDED_LANGS: ""
          EXCLUDE_FORKED_REPOS: "true"
        run: python3 generate_images.py

      - name: Push SVGs to the stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: github-stats-src/generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
