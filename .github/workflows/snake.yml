name: Generate Snake animation

on:
  # Run twice a day so the snake reflects fresh contributions
  schedule:
    - cron: "0 */12 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Also run on push to main so the first commit kicks it off
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (light + dark SVG variants)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: matx104
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
